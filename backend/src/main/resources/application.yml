server:
  port: 8080

spring:
  application:
    name: EmployeeSphere
  
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: EmployeeSphereSuperSecretKeyForJwtAuthenticationThatMustBeLongEnoughToBeSecure12345!
    expirationMs: 86400000 # 24 hours
